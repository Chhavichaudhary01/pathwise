spring:
  application:
    name: pathwise
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pathwise}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:mock-client-id}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:mock-client-secret}
            scope: email, profile

jwt:
  secret: ${JWT_SECRET:this-is-a-default-secret-key-for-local-dev-only-change-it}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000} # 24 hours

ai:
  groq:
    api-key: ${GROQ_API_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
